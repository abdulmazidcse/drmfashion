name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# The build runs on the server, not on the GitHub runner: pages are
# pre-rendered from the live database (localhost:6432 there), which is not
# reachable from outside — and must not be. It happens in a separate checkout
# ($APP_DIR-build) so the running site keeps serving the old build until the
# new one has finished; only then are .next and node_modules swapped in.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Strip Windows line endings and make sure the key ends with a
          # newline — either one makes OpenSSH reject it ("error in libcrypto").
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "SSH_KEY secret is not a valid private key"; exit 1; }
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Build and activate on server
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "APP_DIR='${{ secrets.APP_DIR }}' bash -s" <<'REMOTE'
          set -euo pipefail
          BUILD_DIR="${APP_DIR%/}-build"

          # 1. Fresh copy of main in the build folder (the live folder is untouched)
          if [ ! -d "$BUILD_DIR/.git" ]; then
            git clone "$(git -C "$APP_DIR" remote get-url origin)" "$BUILD_DIR"
          fi
          cd "$BUILD_DIR"
          git fetch origin main
          git reset --hard origin/main
          cp "$APP_DIR/.env" .env

          # 2. Install + build (the live site keeps running meanwhile). The box
          # has 1 vCPU / 2 GB RAM + 4 GB swap: low priority keeps the live site
          # responsive, at the cost of a slower build.
          nice -n 10 npm ci
          nice -n 10 npm run build

          # 3. DB backup, then schema update
          # The database is whatever .env points at. DIRECT_DATABASE_URL skips
          # pgbouncer (pg_dump can't run through it); Prisma-only query params
          # such as ?schema= / ?pgbouncer= are dropped because pg_dump rejects them.
          env_url() { grep -E "^$1=" .env | tail -n1 | cut -d= -f2- | sed -e 's/^["'\'']//' -e 's/["'\'']$//'; }
          DB_URL="$(env_url DIRECT_DATABASE_URL)"
          [ -n "$DB_URL" ] || DB_URL="$(env_url DATABASE_URL)"
          DB_URL="${DB_URL%%\?*}"
          mkdir -p ~/backups
          pg_dump "$DB_URL" -F c > ~/backups/pre_deploy_$(date +%Y%m%d_%H%M%S).dump
          ls -t ~/backups/pre_deploy_*.dump | tail -n +8 | xargs -r rm --
          npx prisma db push

          # 4. Swap the new code, packages and build into the live folder
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main
          rsync -a --delete "$BUILD_DIR/node_modules/" "$APP_DIR/node_modules/"
          rm -rf .next.old
          mv .next .next.old
          cp -a "$BUILD_DIR/.next" .next
          pm2 reload ecosystem.config.js --update-env
          rm -rf .next.old
          echo "Deployed $(git rev-parse --short HEAD)"
          REMOTE

version: '3.8'

# Secrets come from the .env file next to this one (docker compose reads it
# automatically) — never write them here, this file is in git.
#   REDIS_PASSWORD, PGBOUNCER_DB_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD
#
# Every port is bound to 127.0.0.1: only the app on this server talks to these
# services. Published on all interfaces, Docker bypasses ufw and they were open
# to the internet — someone set their own password on the open Redis and took
# the cache (and the site) down on 2026-11-07.

services:
  # Redis Cache for API and Page caching
  redis:
    image: redis:7-alpine
    container_name: fashion_store_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    restart: unless-stopped

  # PgBouncer for Database Connection Pooling
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: fashion_store_pgbouncer
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=${PGBOUNCER_DB_PASSWORD:?set PGBOUNCER_DB_PASSWORD in .env}
      - DB_HOST=host.docker.internal # Points to the host machine's PostgreSQL
      - DB_PORT=5432
      - POOL_MODE=transaction
      - AUTH_TYPE=scram-sha-256
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=50
    ports:
      - "127.0.0.1:6432:5432" # PgBouncer listens on 6432
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # MinIO Object Storage
  minio:
    image: minio/minio
    container_name: fashion_store_minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
